<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 600" style="max-width:100%;height:auto;font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="ch3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ch3-arrow-q" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <filter id="ch3-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1640" height="600" fill="#ffffff"/>

  <text x="820" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">
    EoMT-DINOv3 data flow on a 512 × 512 input
  </text>

  <g font-size="15" fill="#374151">
    <rect x="335" y="65" width="20" height="20" fill="#3a6da9" rx="3"/>
    <text x="365" y="81">frozen pretrained module</text>
    <rect x="620" y="65" width="20" height="20" fill="#d97c2e" rx="3"/>
    <text x="650" y="81">fine-tuned / learnable</text>
    <rect x="900" y="65" width="20" height="20" fill="#4f9d4f" rx="3"/>
    <text x="930" y="81">output / fusion</text>
  </g>

  <line x1="260" y1="160" x2="940" y2="160" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="260" y1="160" x2="260" y2="180" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="940" y1="160" x2="940" y2="180" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="600" y="150" text-anchor="middle" font-size="14" font-style="italic" fill="#6b7280">
    encoder-only design: queries operate on the same patch tokens; no separate decoder
  </text>

  <g filter="url(#ch3-shadow)">
    <rect x="40" y="240" width="170" height="110" rx="12" fill="#ffffff" stroke="#3a6da9" stroke-width="2"/>
    <text x="125" y="285" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">Input image</text>
    <text x="125" y="313" text-anchor="middle" font-size="15" fill="#475569">512 × 512 × 3</text>
  </g>

  <line x1="210" y1="295" x2="262" y2="295" stroke="#374151" stroke-width="2.2" marker-end="url(#ch3-arrow)"/>

  <g filter="url(#ch3-shadow)">
    <rect x="262" y="240" width="200" height="110" rx="12" fill="#3a6da9"/>
    <text x="362" y="280" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">DINOv3 patch embed</text>
    <text x="362" y="305" text-anchor="middle" font-size="14" fill="#dbeafe">16 × 16 patches</text>
    <text x="362" y="325" text-anchor="middle" font-size="14" fill="#dbeafe">→ 32 × 32 tokens, d = 1024</text>
  </g>

  <line x1="462" y1="295" x2="514" y2="295" stroke="#374151" stroke-width="2.2" marker-end="url(#ch3-arrow)"/>

  <g filter="url(#ch3-shadow)">
    <rect x="514" y="240" width="200" height="110" rx="12" fill="#3a6da9"/>
    <text x="614" y="280" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">ViT blocks 1..22</text>
    <text x="614" y="305" text-anchor="middle" font-size="14" fill="#dbeafe">frozen DINOv3 weights</text>
    <text x="614" y="325" text-anchor="middle" font-size="14" fill="#dbeafe">self-attention × 22</text>
  </g>

  <line x1="714" y1="295" x2="766" y2="295" stroke="#374151" stroke-width="2.2" marker-end="url(#ch3-arrow)"/>

  <g filter="url(#ch3-shadow)">
    <rect x="766" y="240" width="220" height="110" rx="12" fill="#d97c2e"/>
    <text x="876" y="280" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">ViT blocks 23, 24</text>
    <text x="876" y="305" text-anchor="middle" font-size="14" fill="#fef3c7">fine-tuned on VOC</text>
    <text x="876" y="325" text-anchor="middle" font-size="14" fill="#fef3c7">queries cross-attend here</text>
  </g>

  <g filter="url(#ch3-shadow)">
    <rect x="710" y="460" width="335" height="100" rx="12" fill="#d97c2e"/>
    <text x="877" y="495" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">100 learnable mask queries</text>
    <text x="877" y="520" text-anchor="middle" font-size="14" fill="#fef3c7">trained from scratch on VOC</text>
    <text x="877" y="540" text-anchor="middle" font-size="14" fill="#fef3c7">cross-attend to ViT patch tokens</text>
  </g>

  <path d="M 877 460 L 877 352" stroke="#b45309" stroke-width="2.2" stroke-dasharray="7,5" fill="none" marker-end="url(#ch3-arrow-q)"/>

  <line x1="986" y1="295" x2="1040" y2="295" stroke="#374151" stroke-width="2.2"/>
  <line x1="1040" y1="200" x2="1040" y2="390" stroke="#374151" stroke-width="2.2"/>
  <line x1="1040" y1="200" x2="1085" y2="200" stroke="#374151" stroke-width="2.2" marker-end="url(#ch3-arrow)"/>
  <line x1="1040" y1="390" x2="1085" y2="390" stroke="#374151" stroke-width="2.2" marker-end="url(#ch3-arrow)"/>

  <g filter="url(#ch3-shadow)">
    <rect x="1085" y="150" width="220" height="100" rx="12" fill="#4f9d4f"/>
    <text x="1195" y="185" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Mask-logits head</text>
    <text x="1195" y="210" text-anchor="middle" font-size="14" fill="#e8f5e9">per-query · patch tokens</text>
    <text x="1195" y="230" text-anchor="middle" font-size="14" fill="#e8f5e9">100 × 32 × 32</text>
  </g>

  <g filter="url(#ch3-shadow)">
    <rect x="1085" y="340" width="220" height="100" rx="12" fill="#4f9d4f"/>
    <text x="1195" y="375" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Class-logits head</text>
    <text x="1195" y="400" text-anchor="middle" font-size="14" fill="#e8f5e9">linear 1024 → 21</text>
    <text x="1195" y="420" text-anchor="middle" font-size="14" fill="#e8f5e9">100 × 21 (20 + bg)</text>
  </g>

  <line x1="1305" y1="200" x2="1360" y2="200" stroke="#374151" stroke-width="2.2"/>
  <line x1="1305" y1="390" x2="1360" y2="390" stroke="#374151" stroke-width="2.2"/>
  <line x1="1360" y1="200" x2="1360" y2="390" stroke="#374151" stroke-width="2.2"/>
  <line x1="1360" y1="295" x2="1410" y2="295" stroke="#374151" stroke-width="2.2" marker-end="url(#ch3-arrow)"/>

  <g filter="url(#ch3-shadow)">
    <rect x="1410" y="240" width="190" height="110" rx="12" fill="#ffffff" stroke="#4f9d4f" stroke-width="2"/>
    <text x="1505" y="280" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">Argmax</text>
    <text x="1505" y="305" text-anchor="middle" font-size="14" fill="#475569">over 100 queries</text>
    <text x="1505" y="325" text-anchor="middle" font-size="14" fill="#475569">+ upsample to 512²</text>
  </g>

  <text x="1505" y="400" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">→ Semantic map</text>
  <text x="1505" y="420" text-anchor="middle" font-size="14" fill="#475569">512 × 512 class indices</text>
</svg>
