<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 580" style="max-width:100%;height:auto;font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="ch2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <filter id="ch2-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1640" height="580" fill="#ffffff"/>

  <text x="820" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">
    ConvNeXt-Small data flow on a 320 × 320 input
  </text>

  <g font-size="15" fill="#374151">
    <rect x="430" y="65" width="20" height="20" fill="#3a6da9" rx="3"/>
    <text x="460" y="81">ImageNet-1K pretrained (no PASCAL VOC)</text>
    <rect x="870" y="65" width="20" height="20" fill="#d97c2e" rx="3"/>
    <text x="900" y="81">multi-label head (trained from scratch)</text>
  </g>

  <!-- Main horizontal pipeline -->

  <g filter="url(#ch2-shadow)">
    <rect x="30" y="240" width="140" height="110" rx="12" fill="#ffffff" stroke="#3a6da9" stroke-width="2"/>
    <text x="100" y="285" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">Input image</text>
    <text x="100" y="313" text-anchor="middle" font-size="14" fill="#475569">320 × 320 × 3</text>
  </g>
  <line x1="170" y1="295" x2="220" y2="295" stroke="#374151" stroke-width="2.2" marker-end="url(#ch2-arrow)"/>

  <g filter="url(#ch2-shadow)">
    <rect x="220" y="240" width="150" height="110" rx="12" fill="#3a6da9"/>
    <text x="295" y="280" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Stem</text>
    <text x="295" y="305" text-anchor="middle" font-size="14" fill="#dbeafe">4 × 4 conv, stride 4</text>
    <text x="295" y="325" text-anchor="middle" font-size="14" fill="#dbeafe">80² × 96</text>
  </g>
  <line x1="370" y1="295" x2="420" y2="295" stroke="#374151" stroke-width="2.2" marker-end="url(#ch2-arrow)"/>

  <g filter="url(#ch2-shadow)">
    <rect x="420" y="240" width="160" height="110" rx="12" fill="#3a6da9"/>
    <text x="500" y="275" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Stage 1</text>
    <text x="500" y="298" text-anchor="middle" font-size="14" fill="#dbeafe">3 × ConvNeXt block</text>
    <text x="500" y="318" text-anchor="middle" font-size="14" fill="#dbeafe">80² × 96</text>
    <text x="500" y="338" text-anchor="middle" font-size="13" fill="#bfdbfe">↓ 2 × 2 downsample</text>
  </g>
  <line x1="580" y1="295" x2="630" y2="295" stroke="#374151" stroke-width="2.2" marker-end="url(#ch2-arrow)"/>

  <g filter="url(#ch2-shadow)">
    <rect x="630" y="240" width="160" height="110" rx="12" fill="#3a6da9"/>
    <text x="710" y="275" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Stage 2</text>
    <text x="710" y="298" text-anchor="middle" font-size="14" fill="#dbeafe">3 × ConvNeXt block</text>
    <text x="710" y="318" text-anchor="middle" font-size="14" fill="#dbeafe">40² × 192</text>
    <text x="710" y="338" text-anchor="middle" font-size="13" fill="#bfdbfe">↓ 2 × 2 downsample</text>
  </g>
  <line x1="790" y1="295" x2="840" y2="295" stroke="#374151" stroke-width="2.2" marker-end="url(#ch2-arrow)"/>

  <g filter="url(#ch2-shadow)">
    <rect x="840" y="240" width="170" height="110" rx="12" fill="#3a6da9"/>
    <text x="925" y="275" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Stage 3</text>
    <text x="925" y="298" text-anchor="middle" font-size="14" fill="#dbeafe">27 × ConvNeXt block</text>
    <text x="925" y="318" text-anchor="middle" font-size="14" fill="#dbeafe">20² × 384</text>
    <text x="925" y="338" text-anchor="middle" font-size="13" fill="#bfdbfe">↓ 2 × 2 downsample</text>
  </g>
  <line x1="1010" y1="295" x2="1060" y2="295" stroke="#374151" stroke-width="2.2" marker-end="url(#ch2-arrow)"/>

  <g filter="url(#ch2-shadow)">
    <rect x="1060" y="240" width="160" height="110" rx="12" fill="#3a6da9"/>
    <text x="1140" y="275" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Stage 4</text>
    <text x="1140" y="298" text-anchor="middle" font-size="14" fill="#dbeafe">3 × ConvNeXt block</text>
    <text x="1140" y="318" text-anchor="middle" font-size="14" fill="#dbeafe">10² × 768</text>
  </g>
  <line x1="1220" y1="295" x2="1270" y2="295" stroke="#374151" stroke-width="2.2" marker-end="url(#ch2-arrow)"/>

  <g filter="url(#ch2-shadow)">
    <rect x="1270" y="240" width="140" height="110" rx="12" fill="#ffffff" stroke="#3a6da9" stroke-width="2"/>
    <text x="1340" y="285" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Global pool</text>
    <text x="1340" y="310" text-anchor="middle" font-size="14" fill="#475569">→ 768-vector</text>
  </g>
  <line x1="1410" y1="295" x2="1460" y2="295" stroke="#374151" stroke-width="2.2" marker-end="url(#ch2-arrow)"/>

  <g filter="url(#ch2-shadow)">
    <rect x="1460" y="240" width="160" height="110" rx="12" fill="#d97c2e"/>
    <text x="1540" y="275" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Head</text>
    <text x="1540" y="298" text-anchor="middle" font-size="13" fill="#fef3c7">Dropout 0.4</text>
    <text x="1540" y="316" text-anchor="middle" font-size="13" fill="#fef3c7">Linear 768→512→20</text>
    <text x="1540" y="334" text-anchor="middle" font-size="13" fill="#fef3c7">sigmoid output</text>
  </g>

  <!-- ConvNeXt block detail (bottom right) -->
  <line x1="500" y1="350" x2="500" y2="430" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="500" y1="430" x2="245" y2="430" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="245" y1="430" x2="245" y2="450" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,3"/>

  <text x="245" y="475" text-anchor="middle" font-size="14" font-style="italic" fill="#475569">one ConvNeXt block (Liu et al., 2022)</text>

  <g filter="url(#ch2-shadow)">
    <rect x="50" y="485" width="125" height="65" rx="8" fill="#eef2f6" stroke="#3a6da9" stroke-width="1.5"/>
    <text x="112" y="510" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">depthwise</text>
    <text x="112" y="528" text-anchor="middle" font-size="13" fill="#475569">7 × 7 conv</text>
    <text x="112" y="544" text-anchor="middle" font-size="12" fill="#6b7280">spatial mixing</text>
  </g>
  <line x1="175" y1="517" x2="200" y2="517" stroke="#374151" stroke-width="2" marker-end="url(#ch2-arrow)"/>

  <g filter="url(#ch2-shadow)">
    <rect x="200" y="485" width="110" height="65" rx="8" fill="#eef2f6" stroke="#3a6da9" stroke-width="1.5"/>
    <text x="255" y="510" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">LayerNorm</text>
    <text x="255" y="528" text-anchor="middle" font-size="12" fill="#6b7280">stable across</text>
    <text x="255" y="542" text-anchor="middle" font-size="12" fill="#6b7280">small batches</text>
  </g>
  <line x1="310" y1="517" x2="335" y2="517" stroke="#374151" stroke-width="2" marker-end="url(#ch2-arrow)"/>

  <g filter="url(#ch2-shadow)">
    <rect x="335" y="485" width="135" height="65" rx="8" fill="#eef2f6" stroke="#3a6da9" stroke-width="1.5"/>
    <text x="402" y="510" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">1 × 1 conv</text>
    <text x="402" y="528" text-anchor="middle" font-size="13" fill="#475569">expand 4×</text>
    <text x="402" y="544" text-anchor="middle" font-size="12" fill="#6b7280">channel mixing</text>
  </g>
  <line x1="470" y1="517" x2="495" y2="517" stroke="#374151" stroke-width="2" marker-end="url(#ch2-arrow)"/>

  <g filter="url(#ch2-shadow)">
    <rect x="495" y="485" width="80" height="65" rx="8" fill="#eef2f6" stroke="#3a6da9" stroke-width="1.5"/>
    <text x="535" y="510" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">GELU</text>
    <text x="535" y="528" text-anchor="middle" font-size="12" fill="#6b7280">nonlinear</text>
  </g>
  <line x1="575" y1="517" x2="600" y2="517" stroke="#374151" stroke-width="2" marker-end="url(#ch2-arrow)"/>

  <g filter="url(#ch2-shadow)">
    <rect x="600" y="485" width="135" height="65" rx="8" fill="#eef2f6" stroke="#3a6da9" stroke-width="1.5"/>
    <text x="667" y="510" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">1 × 1 conv</text>
    <text x="667" y="528" text-anchor="middle" font-size="13" fill="#475569">project back</text>
    <text x="667" y="544" text-anchor="middle" font-size="12" fill="#6b7280">to input dim</text>
  </g>
  <line x1="735" y1="517" x2="760" y2="517" stroke="#374151" stroke-width="2" marker-end="url(#ch2-arrow)"/>

  <g filter="url(#ch2-shadow)">
    <rect x="760" y="485" width="120" height="65" rx="8" fill="#eef2f6" stroke="#3a6da9" stroke-width="1.5"/>
    <text x="820" y="510" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">+ residual</text>
    <text x="820" y="528" text-anchor="middle" font-size="12" fill="#6b7280">from input</text>
    <text x="820" y="544" text-anchor="middle" font-size="12" fill="#6b7280">stabilises gradients</text>
  </g>

  <!-- Stage depth annotation -->
  <text x="1110" y="490" font-size="13" font-style="italic" fill="#475569">
    depths (3, 3, 27, 3); channels (96, 192, 384, 768); ≈ 50 M params
  </text>
  <text x="1110" y="510" font-size="13" font-style="italic" fill="#475569">
    Stage 1: head warm-up (backbone frozen).
  </text>
  <text x="1110" y="528" font-size="13" font-style="italic" fill="#475569">
    Stage 2: full-network fine-tune.
  </text>
  <text x="1110" y="546" font-size="13" font-style="italic" fill="#475569">
    Stage 3: retrain on train + val for submission.
  </text>
</svg>
